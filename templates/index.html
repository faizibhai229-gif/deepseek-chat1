<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek R1 Coding Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-robot"></i> DeepSeek R1 Coding Assistant</h1>
        </header>
        
        <div id="chat-container">
            <!-- Messages will appear here -->
        </div>
        
        <div class="input-area">
            <textarea id="user-input" placeholder="Ask me anything about programming..." rows="1"></textarea>
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    
    <!-- GitHub Push Modal -->
    <div id="github-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Push to GitHub</h2>
            <input type="text" id="repo-name" placeholder="Enter repository name">
            <button id="push-confirm">Push Code</button>
            <div id="push-status"></div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
